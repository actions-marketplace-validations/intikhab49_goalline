name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest
      - name: a PostgreSQL for the db=pg test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser "$USER"
          createdb goalline
          echo "GOALLINE_TEST_PG=postgresql:///goalline" >> "$GITHUB_ENV"
      - run: node --test test/*.test.mjs
        shell: bash

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: a repository whose change moves a test's expectation
        run: bash test/action-fixture.sh "$RUNNER_TEMP/fixture"
      - id: goalline
        uses: ./
        with:
          repo: ${{ runner.temp }}/fixture
          base: main
          command: node ${{ github.workspace }}/test/fake-jest.mjs {files}
          fail-on-flag: 'false'
      - name: the action flagged it
        run: test "${{ steps.goalline.outputs.flagged }}" = "true"
      - name: the same change, explained in .goalpost-acks.json
        run: bash test/action-fixture.sh "$RUNNER_TEMP/explained" explained
      - id: explained
        uses: ./
        with:
          repo: ${{ runner.temp }}/explained
          base: main
          command: node ${{ github.workspace }}/test/fake-jest.mjs {files}
      - name: the explained change passes, with its reason on the card
        run: |
          test "${{ steps.explained.outputs.flagged }}" = "false"
          test "${{ steps.explained.outputs.explained }}" = "1"
          grep -q "explained: add now counts one more, as the task asks" "${{ steps.explained.outputs.report }}"
